traffic_light_red:
  priority: 120
  include:
    - "\\btraffic\\s+light(s)?\\s+(is|turns|turned|becomes)?\\s*red\\b"
    - "\\bred\\s+traffic\\s+light(s)?\\b"
    - "\\bred\\s+light(s)?\\b"
  exclude:
    - "\\blight\\s+traffic\\b"
    - "\\bstreet\\s+light\\b"
traffic_light_green:
  priority: 118
  include:
    - "\\btraffic\\s+light(s)?\\s+(is|turns|turned|becomes)?\\s*green\\b"
    - "\\bgreen\\s+traffic\\s+light(s)?\\b"
    - "\\bgreen\\s+light(s)?\\b"
  exclude:
    - "\\blight\\s+traffic\\b"
    - "\\bstreet\\s+light\\b"
traffic_light:
  priority: 90
  include:
    - "\\btraffic\\s+light(s)?\\b"
  exclude:
    - "\\blight\\s+traffic\\b"
    - "\\bstreet\\s+light\\b"
stop_sign:
  priority: 100
  include:
    - "\\bstop\\s+sign(s)?\\b"
  exclude: []
pedestrian:
  priority: 95
  include:
    - "\\bpedestrian(s)?\\b"
    - "\\bperson\\b"
    - "\\bpeople\\s+(crossing|walking)\\b"
  exclude: []
front_vehicle:
  priority: 80
  include:
    - "\\b(car|vehicle|truck|bus|cars|vehicles)\\s+(ahead|in front|stopped ahead)\\b"
    - "\\bstopped\\s+(car|vehicle|truck|bus|cars|vehicles)\\b"
    - "\\b(cars|vehicles)\\s+are\\s+stopped\\s+ahead\\b"
  exclude: []
parked_vehicle:
  priority: 72
  include:
    - "\\bparked\\s+(car|vehicle|truck|bus|cars|vehicles)\\b"
  exclude: []
lane_turn_left:
  priority: 70
  include:
    - "\\bturn(s|ing)?\\s+left\\b"
    - "\\bleft\\s+lane\\b"
    - "\\bmerge(s|ing)?\\s+left\\b"
  exclude: []
lane_turn_right:
  priority: 70
  include:
    - "\\bturn(s|ing)?\\s+right\\b"
    - "\\bright\\s+lane\\b"
    - "\\bmerge(s|ing)?\\s+right\\b"
  exclude: []
clear_road:
  priority: 60
  include:
    - "\\btraffic\\s+is\\s+clear\\b"
    - "\\broad\\s+is\\s+clear\\b"
    - "\\bno\\s+(cars|vehicles|traffic)\\b"
  exclude: []
obstacle:
  priority: 50
  include:
    - "\\bobstacle(s)?\\b"
    - "\\bblocking\\b"
  exclude: []
